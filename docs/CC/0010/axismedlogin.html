<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AxisMed by Avante — Sistema de Información Hospitalaria</title>
<style>
/* ===== Paleta y base ===== */
:root{
  --marino:#232349; --medio:#1D4F9C; --brillante:#0C74C2; --rojo:#D31E26;
  --txt:#16204A; --txt2:#44506F; --txt3:#55617F; --grisazul:#7A88AC;
  --borde:#D7DFEC; --divisor:#E3E9F2; --fondo:#DCE8F5;
  --ok:#1E7A2E; --okbg:#EFF7EF; --okbd:#BFDFC2;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Sora','Segoe UI',system-ui,sans-serif;
  background:var(--fondo); color:var(--txt); overflow:hidden;
}
button{font-family:inherit}
#app{position:relative;width:100vw;height:100vh}

/* ===== Escenario de la animación (1280x720 escalado) ===== */
#stageWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#stage{position:relative;width:1280px;height:720px;flex:none;border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%, #F3F8FD 0%, #E5EEF8 48%, #DCE8F5 100%)}
#grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(22,32,74,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(22,32,74,.045) 1px,transparent 1px);
  background-size:80px 80px}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 170px rgba(22,32,74,.10)}
#camera{position:absolute;inset:0;animation:camZoom 2.4s cubic-bezier(.33,1,.68,1) forwards}
@keyframes camZoom{from{transform:scale(1.12)}to{transform:scale(1)}}

/* Escena 1: circuito */
#circuit{position:absolute;inset:0;transition:opacity .9s ease}
.s2 #circuit{opacity:.18}
.trace{fill:none;stroke:rgba(22,32,74,.5);stroke-width:2.5;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pad{fill:rgba(22,32,74,.55);opacity:0;animation:padIn .35s ease forwards}
.ring{fill:none;stroke:rgba(22,32,74,.5);stroke-width:2;opacity:0;animation:padIn .35s ease forwards}
@keyframes padIn{to{opacity:1}}
#pulses{position:absolute;inset:0;transition:opacity .6s}
.s2 #pulses{opacity:0}
.pulse{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle,#1D4F9C 0 2px,rgba(29,79,156,.4) 2px 4.5px,transparent 4.5px);
  box-shadow:0 0 10px 2px rgba(29,79,156,.5);
  offset-rotate:0deg;opacity:0;animation:pulseRun 1.5s var(--ease) forwards}
@keyframes pulseRun{
  0%{offset-distance:0%;opacity:0}
  12%{opacity:1}
  86%{opacity:1}
  100%{offset-distance:100%;opacity:0}
}

/* Onda expansiva (escena 2) */
#shock{position:absolute;left:640px;top:360px;width:0;height:0;border-radius:50%;
  border:2px solid rgba(29,79,156,.55);transform:translate(-50%,-50%);opacity:0}
.s2 #shock{animation:shock 1.1s ease-out forwards}
@keyframes shock{0%{width:0;height:0;opacity:.85}100%{width:1120px;height:1120px;opacity:0}}

/* ===== Grupo del logo (cruz + marca) ===== */
#logoGroup{position:absolute;inset:0;transform-origin:652px 242px}
#logoGroup.dock{transform:translate(-12px,-160px) scale(.35);transition:transform 1.4s var(--ease)}
#crossPos{position:absolute;left:640px;top:360px}
#crossMove{position:absolute;left:0;top:0}
.s3 #crossMove{transition:transform .9s var(--ease);transform:translate(-230px,-118px) scale(.8)}
#halo{position:absolute;left:-190px;top:-190px;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(12,116,194,.26),transparent 65%);opacity:0;transition:opacity .8s}
.s3 #halo{opacity:1}
#cross{position:absolute;left:-150px;top:-150px;width:300px;height:300px}
.block{position:absolute;width:75px;height:75px;opacity:0}
.s2 .block{animation:blockIn .6s cubic-bezier(.33,1,.68,1) forwards;animation-delay:var(--d)}
@keyframes blockIn{
  0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.55);box-shadow:0 0 24px 5px rgba(12,116,194,.55)}
  70%{opacity:1;box-shadow:0 0 16px 3px rgba(12,116,194,.3)}
  100%{opacity:1;transform:none;box-shadow:0 0 0 0 rgba(12,116,194,0)}
}
.xline{position:absolute;background:#fff;opacity:0}
#lineV{left:50%;top:0;width:13.5px;height:100%;transform:translateX(-50%) scaleY(0)}
#lineH{top:50%;left:0;height:13.5px;width:100%;transform:translateY(-50%) scaleX(0)}
.s2 #lineV{animation:growV .5s var(--ease) 1.15s forwards}
.s2 #lineH{animation:growH .5s var(--ease) 1.28s forwards}
@keyframes growV{to{opacity:1;transform:translateX(-50%) scaleY(1)}}
@keyframes growH{to{opacity:1;transform:translateY(-50%) scaleX(1)}}
#node{position:absolute;left:0;top:0;width:26px;height:26px;transform:translate(-50%,-50%);
  border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  animation:nodeGlow 2.4s ease forwards;
  transition:width .6s cubic-bezier(.34,1.56,.64,1) 1.8s,height .6s cubic-bezier(.34,1.56,.64,1) 1.8s;z-index:5}
#node::after{content:'';display:block;width:62.5%;height:62.5%;border-radius:50%;background:var(--rojo)}
@keyframes nodeGlow{from{box-shadow:0 0 0 0 rgba(29,79,156,0)}to{box-shadow:0 0 28px 7px rgba(29,79,156,.45)}}
.s2 #node{width:48px;height:48px}

/* Marca (escena 3) */
#brand{position:absolute;left:566px;top:242px;transform:translateY(-52%);opacity:0}
.s3 #brand{opacity:1}
#wordmark{font-weight:700;font-size:100px;line-height:1.02;letter-spacing:-.01em;
  clip-path:inset(0 100% 0 0)}
.s3 #wordmark{animation:reveal 1s var(--ease) .55s forwards}
@keyframes reveal{to{clip-path:inset(0 -8% 0 0)}}
#wordmark .axis{color:var(--txt)}
#wordmark .med{color:var(--brillante)}
#byrow{display:flex;align-items:center;gap:13px;margin-top:12px;opacity:0;transform:translateY(8px)}
.s3 #byrow{animation:fadeUp .6s ease 1.25s forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
#redbar{width:46px;height:3px;background:var(--rojo);transform-origin:left center;transform:scaleX(0)}
.s3 #redbar{animation:barGrow .5s var(--ease) 1.3s forwards}
@keyframes barGrow{to{transform:scaleX(1)}}
#bytext{font-size:21px;letter-spacing:.42em;color:var(--txt2);font-weight:600}

/* HUD inferior */
#hud{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);text-align:center;transition:opacity .9s}
.hud-done #hud{opacity:0}
#hudLabel{font-size:11px;letter-spacing:.18em;color:var(--txt2);font-weight:600}
#hudPct{font-size:12px;color:var(--medio);margin-top:6px;font-weight:600;font-variant-numeric:tabular-nums}
#hudBar{width:400px;height:3px;background:rgba(22,32,74,.12);border-radius:2px;margin:8px auto 0;overflow:hidden}
#hudFill{height:100%;width:0;background:linear-gradient(90deg,#1D4F9C,#0C74C2);border-radius:2px}

/* ===== Tarjeta de login ===== */
#loginCard{position:absolute;left:50%;top:23vh;width:430px;transform:translateX(-50%) translateY(24px);
  background:#fff;border-radius:16px;box-shadow:0 18px 48px rgba(22,60,58,.24);
  padding:18px 28px;opacity:0;pointer-events:none;transition:opacity .9s ease,transform .9s ease}
#loginCard.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#cardHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
#cardTitle{font-size:15px;font-weight:600;color:var(--txt)}
#langPill{display:flex;background:#EDF1F8;border-radius:999px;padding:3px;flex:none}
#langPill button{border:0;background:transparent;color:#5B6B92;font-size:12px;font-weight:600;
  padding:6px 13px;border-radius:999px;cursor:pointer;min-height:0}
#langPill button.active{background:var(--medio);color:#fff}
.step{display:flex;flex-direction:column;gap:11px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--txt2)}
input[type=text],input[type=password],select{
  height:44px;border:1.5px solid var(--borde);border-radius:10px;padding:0 13px;font-size:14px;
  font-family:inherit;color:var(--txt);background:#fff;outline:none;width:100%}
input:focus,select:focus{border-color:var(--medio);box-shadow:0 0 0 3px rgba(29,79,156,.15)}
.passWrap{position:relative}
.passWrap input{padding-right:46px}
#eyeBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border:0;background:transparent;cursor:pointer;color:var(--grisazul);display:flex;
  align-items:center;justify-content:center;border-radius:8px}
#eyeBtn:hover{color:var(--medio)}
#eyeBtn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible+*{outline:2px solid var(--medio);outline-offset:2px}
.rowBetween{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;color:var(--txt2);cursor:pointer;font-weight:500}
.chk input{width:16px;height:16px;accent-color:var(--medio);cursor:pointer}
a.link{color:var(--medio);text-decoration:none;font-size:13px}
a.link:hover{text-decoration:underline}
.btnPri{min-height:44px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,#1D4F9C,#0C74C2)}
.btnPri:hover{filter:brightness(1.1)}
.btnPri:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btnSec{min-height:44px;border:1.5px solid var(--medio);border-radius:10px;background:#fff;color:var(--medio);
  font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.btnSec:hover{background:#F0F5FC}
.errorMsg{color:var(--rojo);font-size:13px;text-align:center;font-weight:500}
.divider{display:flex;align-items:center;gap:12px;color:var(--txt3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--divisor)}
.okBanner{background:var(--okbg);border:1px solid var(--okbd);color:var(--ok);border-radius:10px;
  padding:11px 13px;font-size:13.5px;font-weight:600;text-align:center}
#backLink{background:none;border:0;color:var(--medio);font-size:13px;cursor:pointer;align-self:center;padding:6px}
#backLink:hover{text-decoration:underline}
#cardFoot{margin-top:14px;font-size:11px;color:var(--grisazul);text-align:center}
[hidden]{display:none !important}

/* Modal dispositivo seguro */
#modalOverlay{position:fixed;inset:0;background:rgba(10,20,40,.45);display:flex;
  align-items:center;justify-content:center;z-index:50}
#modalCard{width:380px;background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 18px 48px rgba(22,60,58,.3)}
#modalTitle{font-size:16px;font-weight:700;margin-bottom:10px}
#modalBody{font-size:13.5px;color:var(--txt2);line-height:1.55;margin-bottom:18px}
#modalBtns{display:flex;gap:10px}
#modalBtns button{flex:1}

/* Botón reiniciar */
#restartBtn{position:fixed;left:14px;bottom:12px;z-index:60;border:1px solid var(--borde);
  background:rgba(255,255,255,.75);color:var(--txt3);font-size:11.5px;border-radius:8px;
  padding:7px 12px;cursor:pointer}
#restartBtn:hover{background:#fff;color:var(--medio)}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <div id="stage">
      <div id="grid"></div>
      <div id="camera">
        <div id="circuit"></div>
        <div id="pulses"></div>
        <div id="shock"></div>
        <div id="logoGroup">
          <div id="crossPos">
            <div id="crossMove">
              <div id="halo"></div>
              <div id="cross"></div>
              <div id="node"></div>
            </div>
          </div>
          <div id="brand">
            <div id="wordmark"><span class="axis">Axis</span><span class="med">Med</span></div>
            <div id="byrow"><div id="redbar"></div><div id="bytext">BY AVANTE</div></div>
          </div>
        </div>
      </div>
      <div id="hud">
        <div id="hudLabel">INICIANDO SISTEMA · SYSTEM LOADING</div>
        <div id="hudPct">0%</div>
        <div id="hudBar"><div id="hudFill"></div></div>
      </div>
      <div id="vignette"></div>
    </div>
  </div>

  <!-- Tarjeta de login -->
  <section id="loginCard" aria-label="Inicio de sesión">
    <div id="cardHead">
      <h1 id="cardTitle"></h1>
      <div id="langPill" role="group" aria-label="Idioma / Language">
        <button id="btnEs" type="button">ES</button>
        <button id="btnEn" type="button">EN</button>
      </div>
    </div>

    <!-- Paso 1: autenticación -->
    <form id="stepAuth" class="step" novalidate>
      <label class="fld"><span id="lblUser"></span>
        <input id="inUser" type="text" autocomplete="username">
      </label>
      <label class="fld"><span id="lblPass"></span>
        <span class="passWrap">
          <input id="inPass" type="password" autocomplete="current-password">
          <button id="eyeBtn" type="button">
            <svg id="eyeOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
              <path d="M2 12s3.5-7 10-7c2.1 0 3.9.7 5.4 1.7M22 12s-3.5 7-10 7c-2.1 0-3.9-.7-5.4-1.7"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><line x1="3" y1="3" x2="21" y2="21"/>
            </svg>
          </button>
        </span>
      </label>
      <div class="rowBetween">
        <label class="chk"><input id="inRemember" type="checkbox"><span id="lblRemember"></span></label>
        <a class="link" href="#" id="lnkForgot"></a>
      </div>
      <div id="errAuth" class="errorMsg" hidden></div>
      <button id="btnLogin" class="btnPri" type="submit"></button>
      <div class="divider"><span id="lblOr"></span></div>
      <button id="btnBio" class="btnSec" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 4a8 8 0 0 0-8 8c0 2.5.6 4.6 1.5 6.4"/>
          <path d="M12 4a8 8 0 0 1 8 8c0 2.5-.6 4.6-1.5 6.4"/>
          <path d="M12 7.5a4.5 4.5 0 0 0-4.5 4.5c0 2.2.5 4.2 1.4 5.9"/>
          <path d="M12 7.5a4.5 4.5 0 0 1 4.5 4.5c0 2.2-.5 4.2-1.4 5.9"/>
          <path d="M12 11a1.2 1.2 0 0 0-1.2 1.2c0 2 .4 3.9 1.2 5.6"/>
          <path d="M12 11a1.2 1.2 0 0 1 1.2 1.2c0 2-.4 3.9-1.2 5.6"/>
        </svg>
        <span id="lblBio"></span>
      </button>
    </form>

    <!-- Paso 2: selección de sede -->
    <div id="stepSede" class="step" hidden>
      <div id="okBanner" class="okBanner"></div>
      <label class="fld"><span id="lblSede"></span>
        <select id="selSede">
          <option value="" id="optPh"></option>
          <option value="masferrer">AVANTE Masferrer - Hospital Especializado</option>
          <option value="beethoven">AVANTE Beethoven - Centro Medico Especializado</option>
          <option value="surfcity">AVANTE Surf City - Unidad Médica Satelital</option>
          <option value="colonia">AVANTE Colonia Médica - Hospital Especializado</option>
        </select>
      </label>
      <button id="btnSede" class="btnPri" type="button" disabled></button>
      <button id="backLink" type="button"></button>
    </div>

    <div id="cardFoot">© 2026 Avante · AxisMed</div>
  </section>

  <!-- Modal de dispositivo seguro -->
  <div id="modalOverlay" hidden>
    <div id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalTitle"></div>
      <div id="modalBody"></div>
      <div id="modalBtns">
        <button id="mCancel" class="btnSec" type="button"></button>
        <button id="mOk" class="btnPri" type="button"></button>
      </div>
    </div>
  </div>

  <button id="restartBtn" type="button"></button>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ===== Diccionario bilingüe ===== */
const I18N = {
  es:{
    title:'Sistema de Información Hospitalaria',
    user:'Usuario', userPh:'usuario.avante',
    pass:'Contraseña', passPh:'••••••••',
    showPass:'Ver contraseña', hidePass:'Ocultar contraseña',
    remember:'Recordarme', forgot:'¿Olvidó su contraseña?',
    login:'Ingresar al sistema', or:'o ingrese con', bio:'Ingreso biométrico',
    err:'Ingrese usuario y contraseña',
    granted:'✓ Acceso concedido', fpOk:'✓ Huella verificada',
    banner:'✓ Acceso concedido — seleccione su sede',
    sede:'Sede', sedePh:'Seleccione la sede',
    enterSite:'Ingresar a la sede', entering:'✓ Ingresando…',
    back:'← Volver al inicio de sesión',
    mTitle:'Confirmar dispositivo seguro',
    mBody:'Al activar «Recordarme», sus credenciales se recordarán en este equipo. ¿Confirma que este es un dispositivo seguro y de uso personal?',
    mCancel:'Cancelar', mOk:'Sí, es seguro',
    restart:'↻ Reiniciar animación'
  },
  en:{
    title:'Hospital Information System',
    user:'Username', userPh:'avante.user',
    pass:'Password', passPh:'••••••••',
    showPass:'Show password', hidePass:'Hide password',
    remember:'Remember me', forgot:'Forgot your password?',
    login:'Enter the system', or:'or sign in with', bio:'Biometric sign-in',
    err:'Enter username and password',
    granted:'✓ Access granted', fpOk:'✓ Fingerprint verified',
    banner:'✓ Access granted — select your site',
    sede:'Site', sedePh:'Select a site',
    enterSite:'Enter site', entering:'✓ Signing in…',
    back:'← Back to sign in',
    mTitle:'Confirm trusted device',
    mBody:'When you enable “Remember me”, your credentials will be stored on this computer. Do you confirm this is a secure, personal device?',
    mCancel:'Cancel', mOk:'Yes, it is secure',
    restart:'↻ Replay animation'
  }
};

/* ===== Estado ===== */
const state = {
  lang:'es', step:'auth', showLogin:false,
  showPass:false, secModal:false,
  error:false, loginMsg:false, bioMsg:false, entering:false
};

/* ===== Render de textos (no toca los valores escritos) ===== */
function render(){
  const t = I18N[state.lang];
  document.documentElement.lang = state.lang;
  $('#cardTitle').textContent = t.title;
  $('#btnEs').classList.toggle('active', state.lang==='es');
  $('#btnEn').classList.toggle('active', state.lang==='en');
  $('#lblUser').textContent = t.user;   $('#inUser').placeholder = t.userPh;
  $('#lblPass').textContent = t.pass;   $('#inPass').placeholder = t.passPh;
  const eyeLbl = state.showPass ? t.hidePass : t.showPass;
  $('#eyeBtn').setAttribute('aria-label', eyeLbl); $('#eyeBtn').title = eyeLbl;
  $('#lblRemember').textContent = t.remember;
  $('#lnkForgot').textContent = t.forgot;
  $('#btnLogin').textContent = state.loginMsg ? t.granted : t.login;
  $('#lblOr').textContent = t.or;
  $('#lblBio').textContent = state.bioMsg ? t.fpOk : t.bio;
  $('#errAuth').hidden = !state.error;
  $('#errAuth').textContent = t.err;
  $('#okBanner').textContent = t.banner;
  $('#lblSede').textContent = t.sede;
  $('#optPh').textContent = t.sedePh;
  $('#btnSede').textContent = state.entering ? t.entering : t.enterSite;
  $('#btnSede').disabled = !$('#selSede').value || state.entering;
  $('#backLink').textContent = t.back;
  $('#modalTitle').textContent = t.mTitle;
  $('#modalBody').textContent = t.mBody;
  $('#mCancel').textContent = t.mCancel;
  $('#mOk').textContent = t.mOk;
  $('#restartBtn').textContent = t.restart;
  $('#stepAuth').hidden = state.step!=='auth';
  $('#stepSede').hidden = state.step!=='sede';
  $('#modalOverlay').hidden = !state.secModal;
}

/* ===== Lógica del formulario ===== */
$('#btnEs').addEventListener('click',()=>{state.lang='es';render();});
$('#btnEn').addEventListener('click',()=>{state.lang='en';render();});

$('#eyeBtn').addEventListener('click',()=>{
  state.showPass = !state.showPass;
  $('#inPass').type = state.showPass ? 'text' : 'password';
  $('#eyeOpen').style.display  = state.showPass ? 'none' : '';
  $('#eyeClosed').style.display = state.showPass ? '' : 'none';
  render();
});

['#inUser','#inPass'].forEach(sel=>$(sel).addEventListener('input',()=>{
  if(state.error){state.error=false;render();}
}));

$('#stepAuth').addEventListener('submit',e=>{
  e.preventDefault();
  if(state.loginMsg||state.bioMsg) return;
  if(!$('#inUser').value.trim() || !$('#inPass').value){
    state.error = true; render(); return;
  }
  state.error=false; state.loginMsg=true; render();
  setTimeout(()=>{state.loginMsg=false; state.step='sede'; render();},900);
});

$('#btnBio').addEventListener('click',()=>{
  if(state.loginMsg||state.bioMsg) return;
  state.error=false; state.bioMsg=true; render();
  setTimeout(()=>{state.bioMsg=false; state.step='sede'; render();},1100);
});

$('#inRemember').addEventListener('change',e=>{
  if(e.target.checked){state.secModal=true; render(); $('#mOk').focus();}
});
$('#mCancel').addEventListener('click',()=>{
  $('#inRemember').checked=false; state.secModal=false; render();
});
$('#mOk').addEventListener('click',()=>{state.secModal=false; render();});

$('#selSede').addEventListener('change',render);
$('#btnSede').addEventListener('click',()=>{
  if(!$('#selSede').value) return;
  state.entering=true; render();
});
$('#backLink').addEventListener('click',()=>{
  state.step='auth'; state.entering=false; $('#selSede').value=''; render();
});
$('#lnkForgot').addEventListener('click',e=>e.preventDefault());

/* ===== Construcción del circuito y la cruz ===== */
const TRACES = [
  [[60,80],[340,80],[340,250],[560,250],[560,360],[640,360]],
  [[1220,80],[940,80],[940,250],[720,250],[720,360],[640,360]],
  [[60,640],[340,640],[340,470],[560,470],[560,360],[640,360]],
  [[1220,640],[940,640],[940,470],[720,470],[720,360],[640,360]],
  [[200,30],[200,210],[470,210],[470,320],[600,320],[600,360],[640,360]],
  [[1080,30],[1080,210],[810,210],[810,320],[680,320],[680,360],[640,360]],
  [[200,690],[200,510],[470,510],[470,400],[600,400],[600,360],[640,360]],
  [[1080,690],[1080,510],[810,510],[810,400],[680,400],[680,360],[640,360]]
];
const BLOCKS = [ // (col, fila, color) en grilla 4x4
  [1,0,'B'],[2,0,'N'],[0,1,'N'],[1,1,'M'],[2,1,'M'],[3,1,'B'],
  [0,2,'B'],[1,2,'M'],[2,2,'M'],[3,2,'N'],[1,3,'N'],[2,3,'B']
];
const COLORS = {N:'#232349', M:'#1D4F9C', B:'#0C74C2'};

function pathD(pts){ return 'M '+pts.map(p=>p[0]+' '+p[1]).join(' L '); }

function buildStage(){
  // Circuito SVG
  let svg = '<svg width="1280" height="720" viewBox="0 0 1280 720">';
  TRACES.forEach((pts,i)=>{
    const delay = (i*0.045).toFixed(3);
    svg += `<path class="trace" d="${pathD(pts)}" pathLength="1" style="animation-delay:${delay}s"/>`;
    svg += `<circle class="ring" cx="${pts[0][0]}" cy="${pts[0][1]}" r="5" style="animation-delay:${delay}s"/>`;
    pts.slice(1,-1).forEach((p,j)=>{
      svg += `<circle class="pad" cx="${p[0]}" cy="${p[1]}" r="3.5" style="animation-delay:${(i*0.045+0.15+j*0.12).toFixed(3)}s"/>`;
    });
  });
  svg += '</svg>';
  $('#circuit').innerHTML = svg;

  // Pulsos que convergen al centro
  $('#pulses').innerHTML = TRACES.map((pts,i)=>
    `<div class="pulse" style="offset-path:path('${pathD(pts)}');animation-delay:${(0.45+i*0.045).toFixed(3)}s"></div>`
  ).join('');

  // Bloques de la cruz (llegan desde afuera; interiores primero)
  $('#cross').innerHTML = BLOCKS.map(([c,r,col])=>{
    const bx=(c+0.5)*75-150, by=(r+0.5)*75-150;      // offset desde el centro
    const dist=Math.hypot(bx,by), ux=bx/dist, uy=by/dist;
    const delay=(0.18 + (dist/135)*0.55).toFixed(3);
    return `<div class="block" style="left:${c*75}px;top:${r*75}px;background:${COLORS[col]};`+
           `--dx:${(ux*120).toFixed(1)}px;--dy:${(uy*120).toFixed(1)}px;--d:${delay}s"></div>`;
  }).join('') + '<div class="xline" id="lineV"></div><div class="xline" id="lineH"></div>';
}

/* ===== Escalado del escenario ===== */
function fit(){
  const s = Math.min(innerWidth/1280, innerHeight/720)*0.97;
  $('#stage').style.transform = `scale(${s})`;
}
addEventListener('resize',fit);

/* ===== Línea de tiempo de la animación (11.9 s + 0.7 s) ===== */
let timers=[], rafId=null, t0=0;
const easeIO = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function pct(t){
  if(t<=2.4)  return 38*easeIO(t/2.4);
  if(t<=6.4)  return 38+38*easeIO((t-2.4)/4);
  return Math.min(100, 76+24*easeIO((t-6.4)/1.5));
}
function tick(now){
  const t=(now-t0)/1000, p=pct(t), done=p>=100;
  $('#hudFill').style.width = p+'%';
  $('#hudPct').textContent = Math.round(p)+'%';
  $('#hudLabel').textContent = done ? 'LISTO · READY'
    : t<2.4 ? 'INICIANDO SISTEMA · SYSTEM LOADING'
    : 'CARGANDO MÓDULOS · LOADING MODULES';
  if(t<9) rafId=requestAnimationFrame(tick);
}
function startTimeline(){
  t0=performance.now();
  const sched=(ms,fn)=>timers.push(setTimeout(fn,ms));
  const st=$('#stage');
  sched(2400 ,()=>st.classList.add('s2'));
  sched(6400 ,()=>st.classList.add('s3'));
  sched(8600 ,()=>st.classList.add('hud-done'));      // barra en 100% y se desvanece
  sched(10500,()=>$('#logoGroup').classList.add('dock')); // tras la pausa de 2 s
  sched(12600,()=>{state.showLogin=true; $('#loginCard').classList.add('show');});
  rafId=requestAnimationFrame(tick);
}

/* ===== Reinicio (para demostraciones) ===== */
function restart(){
  timers.forEach(clearTimeout); timers=[];
  if(rafId) cancelAnimationFrame(rafId);
  $('#stage').classList.remove('s2','s3','hud-done');
  $('#logoGroup').classList.remove('dock');
  state.showLogin=false; $('#loginCard').classList.remove('show');
  // Reconstruir contenido animado para que las animaciones CSS vuelvan a correr
  const cam=$('#camera'), clone=cam.cloneNode(true);
  cam.replaceWith(clone);
  buildStage();
  $('#hudFill').style.width='0'; $('#hudPct').textContent='0%';
  startTimeline();
}
$('#restartBtn').addEventListener('click',restart);

/* ===== Arranque (una sola vez; no se repite al volver a la pestaña) ===== */
buildStage(); fit(); render(); startTimeline();
</script>
</body>
