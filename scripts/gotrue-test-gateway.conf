# Reverse-proxy mínimo para el stack de test E2E (docker-compose.test.yml,
# servicio `gotrue-gateway`, imagen nginx:alpine).
#
# Causa raíz (run de CI 32161787085, PR #541): GoTrue registra TODAS sus
# rutas en su propia raíz (`/admin/users`, `/token`, `/user`, `/health`, ver
# internal/api/api.go en github.com/supabase/auth) — SIN el prefijo
# `/auth/v1`. Ese prefijo es una convención de Kong (el API gateway del
# stack completo de self-hosting de Supabase), no algo que GoTrue mismo
# entienda. Tanto `packages/database/scripts/seed-test-users.mjs`
# (fetch a `${url}/auth/v1/admin/users`) como el propio
# `@supabase/supabase-js`/`@supabase/ssr` que usa la app (siempre arma
# `${url}/auth/v1/...`) construyen URLs con ese prefijo — sin este gateway,
# ambos reciben 404 de GoTrue directo.
#
# Esta imagen reemplaza el server block por defecto de nginx (que normalmente
# escucha en :80 y sirve la página de bienvenida) por uno que escucha en el
# mismo puerto 9999 que la app espera vía NEXT_PUBLIC_SUPABASE_URL, y
# reescribe `/auth/v1/<resto>` -> `gotrue:9999/<resto>` (el trailing slash en
# `location` y en `proxy_pass` es lo que hace que nginx recorte el prefijo).
server {
    listen 9999;
    # nginx solo bindea IPv4 con "listen 9999;" a secas en este base image
    # (el script de entrada que agrega el listener IPv6 automáticamente SOLO
    # parchea el default.conf de fábrica, verificado por checksum contra el
    # paquete apk — el nuestro es distinto, nunca lo toca, con o sin :ro).
    # Causa raíz real (run de CI 32162808668): el healthcheck usa
    # "wget http://localhost:9999/..." y localhost resolvía primero a
    # ::1 (IPv6) dentro del contenedor -> "Connection refused" porque nginx
    # no escuchaba ahí. Bindeamos los dos explícitamente.
    listen [::]:9999;

    location /auth/v1/ {
        proxy_pass http://gotrue:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
