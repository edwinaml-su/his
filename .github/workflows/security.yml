name: Security

on:
  schedule:
    # Lunes 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - '**/package.json'

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install (no audit during install)
        run: npm ci --no-audit

      # OWASP A03:2025 — "prioritize signed packages to prevent malicious
      # modifications". Verifica firmas/attestations del registry contra el
      # lockfile: detecta un tarball alterado aunque la versión coincida.
      #
      # Va ANTES del audit de severidad alta a propósito: si este paso quedara
      # después, cualquier corrida en que el audit falle nunca llegaría a ejecutar
      # la verificación de firmas — quedaría cableada pero inerte.
      #
      # Histórico: el gate de audit estuvo rojo de forma sostenida (2026-07-27 a
      # 2026-08-18) por `expr-eval` (GHSA-8gw3-rxh4-v6jx prototype pollution +
      # GHSA-jc85-fpwf-qm7x CWE-94), paquete sin mantenimiento y SIN fix upstream
      # en ninguna versión publicada. Cerrado 2026-08-18 aliasando la dependencia
      # al fork parchado `expr-eval-fork@3.0.3` — la remediación que indican ambos
      # advisories. Ver `overrides` en el package.json raíz y §3 A03 de
      # docs/audit/2026-08-17_owasp_2025_remediacion.md.
      # NOTA: la causa NO era Next 14. La migración a Next 16.3.1 (PR #534,
      # 2026-08-17) es un asunto aparte y ya está hecha.
      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit production deps (high severity)
        run: npm audit --omit=dev --audit-level=high

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --no-audit --ignore-scripts

      # OWASP A03:2025 — inventario centralizado de dependencias directas y
      # transitivas. Sin SBOM no hay forma de responder "¿nos afecta esta CVE?"
      # sin reinstalar el árbol completo.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.cdx.json --output-format JSON

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Necesario para escanear el historial completo
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE solo necesaria para uso comercial en organizaciones grandes
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
