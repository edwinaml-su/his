name: E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      max_failures:
        description: >-
          Override del circuit breaker maxFailures (playwright.config.ts).
          Vacio = defaults (25 full / 8 con E2E_GREP). Usar 0 para inventario
          completo sin corte (~486 tests, consume el timeout-minutes del job).
        required: false
        type: string
      timeout_minutes:
        description: >-
          Timeout del job en minutos (default 30). Para inventario completo
          usar 90-120: la suite serial de ~486 specs no cabe en 30 (run
          33018607233 cancelado a los 30m27s con max_failures=200).
        required: false
        type: string
  schedule:
    # Nightly 06:00 UTC ≈ 00:00 America/El_Salvador (UTC-6)
    - cron: '0 6 * * *'

# Scope mínimo: solo lectura. No escribe al repo ni comenta en PRs. [infra-P1-3]
permissions:
  contents: read

# El grupo incluye event_name: el nightly (schedule, 30 min, corte a 25
# fallos) NO debe cancelar un inventario lanzado por workflow_dispatch —
# run 33193829657 (inventario 330 min) murió a los 76 min cuando entró el
# schedule al mismo grupo e2e-main.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Alineado con engines.node ("24.x") en package.json raíz — ver ci.yml.
  NODE_VERSION: '24'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # workflow_dispatch puede subirlo vía input; schedule/nightly queda en 30
    # (inputs es null en schedule → fromJSON('30')).
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '30') }}

    env:
      DATABASE_URL: postgresql://his:his@localhost:5432/his_e2e?schema=public
      DIRECT_URL: postgresql://his:his@localhost:5432/his_e2e?schema=public
      # GoTrue local (docker-compose.test.yml, servicio `gotrue`) — backend
      # real de Supabase Auth para el stack de test, NO un mock. ANON_KEY y
      # SERVICE_ROLE_KEY se derivan de GOTRUE_JWT_SECRET en el paso "Generar
      # API keys de test (GoTrue)" — deben firmarse con el MISMO secreto que
      # consume el contenedor `gotrue`, así que no se hardcodean acá.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:9999
      GOTRUE_JWT_SECRET: e2e-gotrue-test-secret-do-not-use-in-prod-only
      AUTH_SECRET: e2e-dummy-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generar API keys de test (GoTrue)
        # ANON_KEY/SERVICE_ROLE_KEY son JWTs HS256 firmados con
        # GOTRUE_JWT_SECRET — ver scripts/gotrue-test-jwt.mjs. Deben existir
        # ANTES de "Build app": NEXT_PUBLIC_SUPABASE_ANON_KEY se inlinea en
        # el bundle cliente en build time (Next.js), no en runtime.
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(node scripts/gotrue-test-jwt.mjs anon)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(node scripts/gotrue-test-jwt.mjs service_role)" >> "$GITHUB_ENV"

      - name: Boot test stack (Postgres + GoTrue efímeros)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Verificar CORS de GoTrue (apikey) — fail-fast
        # Regresión del run 32588358301: 25 failed / 459 did not run, todos
        # por "login no redirigió" → cuenta bloqueada. Causa real: supabase-js
        # manda el header `apikey` en TODA request de auth (SupabaseClient.ts
        # #_initSupabaseAuthClient), pero el CORS default de GoTrue no lo
        # permite — el navegador bloquea el POST real después de un preflight
        # OPTIONS 204 "exitoso" (0 líneas "POST /auth/v1/token" en los logs
        # de ese run, solo OPTIONS). signInWithPassword revienta con
        # "Failed to fetch" en TODOS los intentos, dispara el lockout de 5
        # fallos de login-policy.ts, y el resto de la suite muere con "Cuenta
        # bloqueada" — un síntoma que no tiene nada que ver con el lockout en
        # sí (correcto: resetea el contador en login exitoso, solo que nunca
        # hubo uno). Ver GOTRUE_CORS_ALLOWED_HEADERS en docker-compose.test.yml.
        # Este check falla en segundos en vez de quemar ~19 min de suite.
        run: |
          headers=$(curl -s -o /dev/null -D - \
            -X OPTIONS "http://localhost:9999/auth/v1/token?grant_type=password" \
            -H "Origin: http://localhost:3000" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info")
          echo "$headers"
          echo "$headers" | grep -i "^access-control-allow-headers:" | grep -qi "apikey" || {
            echo "::error::GoTrue no incluye 'apikey' en Access-Control-Allow-Headers. El navegador bloqueará signInWithPassword con 'Failed to fetch' y login() disparará el lockout de cuenta en cascada para TODA la suite (ver run 32588358301). Revisar GOTRUE_CORS_ALLOWED_HEADERS en docker-compose.test.yml."
            exit 1
          }

      - name: Dump logs del stack (si el boot falló)
        # Sin esto, un fallo acá es "exited (1)" sin más — el mismo tipo de
        # fallo opaco que esta tanda de trabajo vino a eliminar. Vuelca ps -a
        # (para ver exit codes de cada servicio) + logs completos de cada
        # contenedor del compose, agrupados para que sea legible en el log
        # del job de GitHub Actions.
        if: failure()
        run: |
          echo "::group::docker compose ps -a"
          docker compose -f docker-compose.test.yml ps -a
          echo "::endgroup::"
          echo "::group::logs: postgres-test"
          docker compose -f docker-compose.test.yml logs postgres-test --no-color || true
          echo "::endgroup::"
          echo "::group::logs: gotrue"
          docker compose -f docker-compose.test.yml logs gotrue --no-color || true
          echo "::endgroup::"
          echo "::group::logs: gotrue-gateway"
          docker compose -f docker-compose.test.yml logs gotrue-gateway --no-color || true
          echo "::endgroup::"
          echo "::group::docker inspect: healthcheck detail"
          docker inspect his-postgres-test his-gotrue-test his-gotrue-gateway-test --format '{{.Name}}: {{json .State.Health}}' || true
          echo "::endgroup::"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Sync schema to ephemeral DB
        # CLAUDE.md §db: sin carpeta `prisma/migrations`. Usamos `db push` para
        # crear el schema completo de Prisma en la BD efímera del runner.
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Bootstrap RLS helpers (set_tenant_context + rol authenticated)
        # Portado 1:1 de e2e-smoke.yml (PR #597): `db push` no aplica el corpus
        # SQL hand-rolled — sin set_tenant_context()/ece.set_ece_context() los
        # ~50 routers con withTenantContext/withEceContext revientan con
        # INTERNAL_SERVER_ERROR y el inventario mide infra rota, no producto
        # (runs 33182478251/33193829657: los ~103 "fallos de producto" del
        # triage parcial estaban contaminados por esto). Ver
        # scripts/e2e-rls-bootstrap.sql para el detalle y por qué NO se aplica
        # el corpus RLS completo acá.
        run: |
          npx prisma db execute --schema=packages/database/prisma/schema.prisma --file=packages/database/sql/04_rls_session_helpers.sql
          npx prisma db execute --schema=packages/database/prisma/schema.prisma --file=packages/database/sql/62b_ece_context_helpers.sql
          npx prisma db execute --schema=packages/database/prisma/schema.prisma --file=scripts/e2e-rls-bootstrap.sql

      - name: Seed minimal data
        run: npm run db:seed
        continue-on-error: true

      - name: Seed usuarios de test E2E (GoTrue)
        # Crea qa.admin@his.test / qa.triagist@his.test / etc. en el GoTrue
        # local + su fila espejo en public."User" (mismo id). Sin
        # continue-on-error: si esto falla, login() falla para TODA la suite.
        run: node packages/database/scripts/seed-test-users.mjs

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        env:
          E2E_MAX_FAILURES: ${{ inputs.max_failures }}
        run: npm run test:e2e

      - name: Dump logs del stack (si algo posterior al boot falló)
        # Ver el mismo step en e2e-smoke.yml: el dump de arriba solo cubre un
        # fallo del propio "Boot test stack"; si el stack queda healthy pero
        # un step posterior falla (seed, build, tests), este segundo dump es
        # el único que ve el estado real de los contenedores en ese momento.
        if: failure()
        run: |
          echo "::group::docker compose ps -a"
          docker compose -f docker-compose.test.yml ps -a
          echo "::endgroup::"
          echo "::group::logs: postgres-test"
          docker compose -f docker-compose.test.yml logs postgres-test --no-color --tail=200 || true
          echo "::endgroup::"
          echo "::group::logs: gotrue"
          docker compose -f docker-compose.test.yml logs gotrue --no-color --tail=200 || true
          echo "::endgroup::"
          echo "::group::logs: gotrue-gateway"
          docker compose -f docker-compose.test.yml logs gotrue-gateway --no-color --tail=200 || true
          echo "::endgroup::"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
