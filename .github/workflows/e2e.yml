name: E2E (Playwright)

on:
  workflow_dispatch:
  schedule:
    # Nightly 06:00 UTC ≈ 00:00 America/El_Salvador (UTC-6)
    - cron: '0 6 * * *'

# Scope mínimo: solo lectura. No escribe al repo ni comenta en PRs. [infra-P1-3]
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Alineado con engines.node ("24.x") en package.json raíz — ver ci.yml.
  NODE_VERSION: '24'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://his:his@localhost:5432/his_e2e?schema=public
      DIRECT_URL: postgresql://his:his@localhost:5432/his_e2e?schema=public
      # GoTrue local (docker-compose.test.yml, servicio `gotrue`) — backend
      # real de Supabase Auth para el stack de test, NO un mock. ANON_KEY y
      # SERVICE_ROLE_KEY se derivan de GOTRUE_JWT_SECRET en el paso "Generar
      # API keys de test (GoTrue)" — deben firmarse con el MISMO secreto que
      # consume el contenedor `gotrue`, así que no se hardcodean acá.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:9999
      GOTRUE_JWT_SECRET: e2e-gotrue-test-secret-do-not-use-in-prod-only
      AUTH_SECRET: e2e-dummy-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generar API keys de test (GoTrue)
        # ANON_KEY/SERVICE_ROLE_KEY son JWTs HS256 firmados con
        # GOTRUE_JWT_SECRET — ver scripts/gotrue-test-jwt.mjs. Deben existir
        # ANTES de "Build app": NEXT_PUBLIC_SUPABASE_ANON_KEY se inlinea en
        # el bundle cliente en build time (Next.js), no en runtime.
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(node scripts/gotrue-test-jwt.mjs anon)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(node scripts/gotrue-test-jwt.mjs service_role)" >> "$GITHUB_ENV"

      - name: Boot test stack (Postgres + GoTrue efímeros)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Sync schema to ephemeral DB
        # CLAUDE.md §db: sin carpeta `prisma/migrations`. Usamos `db push` para
        # crear el schema completo de Prisma en la BD efímera del runner.
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Seed minimal data
        run: npm run db:seed
        continue-on-error: true

      - name: Seed usuarios de test E2E (GoTrue)
        # Crea qa.admin@his.test / qa.triagist@his.test / etc. en el GoTrue
        # local + su fila espejo en public."User" (mismo id). Sin
        # continue-on-error: si esto falla, login() falla para TODA la suite.
        run: node packages/database/scripts/seed-test-users.mjs

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
