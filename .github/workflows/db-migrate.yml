name: DB Migrate (Prisma deploy)

# ⚠️ Workflow inerte por ahora: el proyecto NO usa el flujo estándar de
# Prisma Migrate (no existe packages/database/prisma/migrations/). El flujo
# real, documentado en CLAUDE.md, es schema.prisma + archivos SQL numerados
# en packages/database/sql/ aplicados vía Supabase MCP / SQL Editor. Sin un
# guard, `prisma migrate deploy` corría sobre 0 migraciones trackeadas: podía
# "tener éxito" sin aplicar nada (falsa sensación de BD sincronizada) o
# fallar de forma opaca. El primer step aborta explícito en ese caso — ver
# @DBA para el baseline de migraciones Prisma en curso, que reactivará este
# workflow.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente destino'
        required: true
        type: choice
        options:
          - preview
          - staging
          - production
      dry_run:
        description: 'Solo mostrar migraciones pendientes (no aplicar)'
        required: false
        type: boolean
        default: false

# Solo una migración a la vez por ambiente
# Scope mínimo: solo lectura. Consume secrets de ambiente. [infra-P1-3]
permissions:
  contents: read

concurrency:
  group: db-migrate-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy → ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Requiere que el ambiente esté configurado en GitHub con required reviewers
    # (Settings → Environments → preview|staging|production)
    environment: ${{ github.event.inputs.environment }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verificar prerequisitos (fail-fast)
        run: |
          # 1) Este proyecto no trackea migraciones Prisma — abortar explícito
          #    en vez de dejar que `prisma migrate deploy` corra sobre 0
          #    migraciones y reporte éxito engañoso, o falle de forma opaca.
          if [ ! -d "packages/database/prisma/migrations" ] || [ -z "$(ls -A packages/database/prisma/migrations 2>/dev/null)" ]; then
            echo "::error::No existe packages/database/prisma/migrations/ (o está vacío). Este proyecto NO usa 'prisma migrate deploy' — el flujo real es schema.prisma + SQL numerados en packages/database/sql/ aplicados vía Supabase MCP/SQL Editor (ver CLAUDE.md). Este workflow queda deshabilitado hasta que exista un baseline real de migraciones Prisma."
            exit 1
          fi

          # 2) Sin credenciales del ambiente, `prisma migrate deploy` falla con
          #    un error de conexión difícil de diagnosticar. Fallar antes, con
          #    un mensaje que apunte a la causa real.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL vacío para el ambiente '${{ github.event.inputs.environment }}'. Configura el secret en Settings → Environments → ${{ github.event.inputs.environment }} antes de correr este workflow."
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL vacío para el ambiente '${{ github.event.inputs.environment }}'. Configura el secret en Settings → Environments → ${{ github.event.inputs.environment }} antes de correr este workflow."
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Show pending migrations (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npx prisma migrate status --schema=packages/database/prisma/schema.prisma

      - name: Apply migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Verify state post-migration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npx prisma migrate status --schema=packages/database/prisma/schema.prisma

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Migración a ${{ github.event.inputs.environment }} falló. Revisar logs y aplicar runbook RB-04."
